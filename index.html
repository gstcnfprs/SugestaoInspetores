:root{
  --azul:#00509b;--azul-800:#003b73;--azul-900:#00305e;--azul-600:#1465b0;--azul-100:#e6f0fa;--azul-050:#f2f7fc;
  --ouro:#ba9705;--ouro-tx:#735f03;--ouro-100:#faf1cf;
  --bg:#f6f8fb;--sup:#ffffff;--sup2:#eef2f6;--sup3:#e6ebf1;--borda:#dfe5ec;--borda2:#c7d0dc;
  --tx:#161d24;--tx2:#4a586b;--tx3:#5c6b7f;
  --link:#00509b;--btn:#00509b;--btn-tx:#ffffff;--btn-hover:#003b73;
  --ok:#1b6b36;--ok-bg:#e3f3e8;--erro:#a52019;--erro-bg:#fbe9e7;--aten:#7a4f00;--aten-bg:#fff2cf;--info:#0b4f8a;--info-bg:#e6f0fa;
  --cinza-bg:#eef2f6;--cinza:#4a586b;
  --moldura:#161d24;--alvo:#c0262d;--alvo-sombra:rgba(192,38,45,.22);--sombra:0 1px 2px rgba(12,17,22,.06),0 8px 24px -8px rgba(12,17,22,.14);
  --f-titulo:'Barlow Semi Condensed','Public Sans',system-ui,sans-serif;--f-corpo:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --azul:#5a9be0;--azul-800:#8dbaeb;--azul-900:#0c1d30;--azul-600:#76abe6;--azul-100:#13283f;--azul-050:#0f1e30;
  --ouro:#d4af1f;--ouro-tx:#e0bf3a;--ouro-100:#3a3010;
  --bg:#0c1116;--sup:#161d24;--sup2:#1d262f;--sup3:#232c35;--borda:#2f3a46;--borda2:#435062;
  --tx:#eef2f6;--tx2:#b4c0cf;--tx3:#a3b0c2;
  --link:#8dbaeb;--btn:#1f6fc0;--btn-tx:#ffffff;--btn-hover:#2a7fd4;
  --ok:#86d6a0;--ok-bg:#13301d;--erro:#ffa198;--erro-bg:#3a1714;--aten:#f2c66d;--aten-bg:#3a2c0c;--info:#8dbaeb;--info-bg:#13283f;
  --cinza-bg:#232c35;--cinza:#b4c0cf;--moldura:#05080b;--alvo:#ff6b6b;--alvo-sombra:rgba(255,107,107,.3);--sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --azul:#5a9be0;--azul-800:#8dbaeb;--azul-900:#0c1d30;--azul-600:#76abe6;--azul-100:#13283f;--azul-050:#0f1e30;
  --ouro:#d4af1f;--ouro-tx:#e0bf3a;--ouro-100:#3a3010;
  --bg:#0c1116;--sup:#161d24;--sup2:#1d262f;--sup3:#232c35;--borda:#2f3a46;--borda2:#435062;
  --tx:#eef2f6;--tx2:#b4c0cf;--tx3:#a3b0c2;
  --link:#8dbaeb;--btn:#1f6fc0;--btn-tx:#ffffff;--btn-hover:#2a7fd4;
  --ok:#86d6a0;--ok-bg:#13301d;--erro:#ffa198;--erro-bg:#3a1714;--aten:#f2c66d;--aten-bg:#3a2c0c;--info:#8dbaeb;--info-bg:#13283f;
  --cinza-bg:#232c35;--cinza:#b4c0cf;--moldura:#05080b;--alvo:#ff6b6b;--alvo-sombra:rgba(255,107,107,.3);--sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f-corpo);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--link)}
.oculto{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:6px}

/* Lista de integrações */
.apis{display:grid;gap:8px}
.api{border:1px solid var(--borda);border-radius:10px;padding:9px 11px;background:var(--sup)}
.api-l1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.api-nome{font-weight:700;font-size:14px}
.api p{margin:4px 0 0;font-size:13.5px;color:var(--tx2)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-aguarda{background:var(--aten-bg);color:var(--aten)}
.st-pronto{background:var(--ok-bg);color:var(--ok)}
.st-preparo{background:var(--info-bg);color:var(--info)}
.st-interno{background:var(--cinza-bg);color:var(--cinza)}
.legenda{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--tx2);margin:6px 0 0}

/* Navegador */
.nav-web{width:min(860px,100%);border-radius:12px;overflow:hidden;border:1px solid var(--borda2);background:var(--sup);box-shadow:var(--sombra)}
.nav-barra{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sup3);border-bottom:1px solid var(--borda)}
.nav-barra i{width:10px;height:10px;border-radius:50%;background:var(--borda2);display:block}
.nav-end{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--sup);border:1px solid var(--borda);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-end svg{flex-shrink:0}
.web-app{display:flex;flex-direction:column;height:580px}
.web-topo{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--borda);background:var(--sup)}
.web-topo img{height:26px;width:auto}
.web-topo nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.web-topo nav span{padding:5px 10px;border-radius:8px;font-size:13.5px;color:var(--tx2)}
.web-topo nav span.ativo{background:var(--azul-100);color:var(--azul-800);font-weight:600}
:root[data-theme="dark"] .web-topo nav span.ativo{color:#dbe9f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .web-topo nav span.ativo{color:#dbe9f8}}
.web-usuario{margin-left:auto;font-size:13px;color:var(--tx2);text-align:right;line-height:1.25}
.web-usuario b{display:block;color:var(--tx);font-weight:600}
.web-corpo{flex:1;overflow:auto;padding:20px 22px;background:var(--bg)}

/* Telefones */
.tel{width:300px;max-width:100%;height:620px;border-radius:40px;background:var(--moldura);padding:10px;box-shadow:var(--sombra);position:relative}
.tel-tela{height:100%;border-radius:31px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.tel-status{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 4px;font-size:12px;font-weight:600;color:var(--tx)}
.d-ios .tel{border-radius:46px}
.d-ios .tel-tela{border-radius:37px}
.d-ios .tel-status{padding:11px 26px 6px}
.ilha{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:90px;height:24px;border-radius:14px;background:#000;z-index:3}
.camera{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#000;z-index:3}
.icones{display:flex;gap:4px;align-items:center}
.icones i{display:block;background:currentColor;border-radius:2px}
.app-barra{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;background:var(--sup);border-bottom:1px solid var(--borda)}
.app-barra b{font:700 17px var(--f-titulo);letter-spacing:.01em}
.d-ios .app-barra{flex-direction:column;align-items:flex-start;gap:0;padding:2px 16px 10px}
.d-ios .app-barra b{font:700 24px var(--f-titulo)}
.d-ios .app-barra .voltar{font-size:14px;color:var(--link)}
.d-android .app-barra .voltar{font-size:18px;line-height:1;color:var(--tx2)}
.app-corpo{flex:1;overflow:auto;padding:14px}
.abas{display:flex;justify-content:space-around;border-top:1px solid var(--borda);background:var(--sup);padding:6px 4px 4px}
.abas span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--tx3);min-width:52px}
.abas span i{width:20px;height:4px;border-radius:2px;background:var(--borda2);display:block}
.abas span.ativo{color:var(--azul);font-weight:700}
.abas span.ativo i{background:var(--azul)}
.d-android .abas span.ativo i{width:44px;height:22px;border-radius:12px;background:var(--azul-100)}
.d-android .abas span i{height:22px;width:22px;border-radius:12px;background:transparent;border:2px solid var(--borda2)}
.d-android .abas span.ativo i{border:0}
.gesto{height:18px;display:flex;align-items:center;justify-content:center;background:var(--sup)}
.gesto i{width:110px;height:4px;border-radius:2px;background:var(--tx);opacity:.6}
.d-android .gesto i{width:80px;height:3px}

/* Componentes das telas */
.s{font-size:14px;color:var(--tx)}
.s h3{margin:0 0 4px;font:700 20px/1.15 var(--f-titulo);text-wrap:balance}
.s h4{margin:14px 0 6px;font:700 13px var(--f-corpo);letter-spacing:.06em;text-transform:uppercase;color:var(--tx2)}
.s p{margin:0 0 10px;text-wrap:pretty}
.s .meta{color:var(--tx2);font-size:13px}
.s .bloco{background:var(--sup);border:1px solid var(--borda);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grade-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.m .grade-2{grid-template-columns:minmax(0,1fr)}
.num{font:700 26px/1 var(--f-titulo);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;min-height:40px;text-align:center;transition-property:background-color,transform;transition-duration:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--btn);color:var(--btn-tx)}
.btn-p:hover{background:var(--btn-hover)}
.btn-s{background:var(--sup);color:var(--tx);border-color:var(--borda2)}
.btn-s:hover{border-color:var(--azul)}

.explica .ramos{gap:6px}
.explica .ramo{font-size:14px}
.fx-fim.ativo{border-color:var(--alvo);box-shadow:0 0 0 3px var(--alvo-sombra)}
.fx-dec.ativo .losango{background:var(--alvo)}
/* Janela */
.modal{border:0;padding:0;border-radius:16px;background:var(--sup);color:var(--tx);width:min(96vw,1800px);height:min(92dvh,1100px);max-width:none;max-height:none;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.modal[open]{display:flex;flex-direction:column}
.modal::backdrop{background:rgba(8,14,22,.6)}
.modal-cab{display:flex;align-items:center;gap:8px 12px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.modal-cab h2{margin:0;font:700 19px var(--f-titulo);min-width:0;flex:1}
.modal-abas{display:flex;gap:4px;flex-wrap:wrap}
.fechar{border:1px solid var(--borda2);background:var(--sup2);border-radius:8px;padding:4px 12px;cursor:pointer;min-height:34px;font-size:14px}
.modal-corpo{flex:1;min-height:0;position:relative;overflow:hidden}
.modal-corpo.texto{overflow:auto;padding:16px 18px 22px}
.modal-corpo .encaixe{position:absolute;left:0;top:0;transform-origin:0 0}
.det{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;max-width:1400px}
@media (max-width:899px){.det{grid-template-columns:minmax(0,1fr)}}
.det h3{margin:0 0 8px;font:700 12.5px var(--f-corpo);letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.det p{margin:0 0 9px;text-wrap:pretty}
.det ul{margin:0 0 10px;padding-left:18px}
.det li{margin:3px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--tx2);padding:6px 16px 10px;border-top:1px solid var(--borda)}
.leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--borda2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-height:560px) and (min-width:600px){
 .barra{padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:5px;flex-wrap:nowrap}
 .marca-topo span{display:none}
 .nav-topo{order:0;width:auto;margin-left:auto;flex:1 1 auto;justify-content:flex-end}
 .ir-para{flex:0 1 auto;width:min(300px,34vw)}
 #tema{margin-left:0}
 .corpo{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"palco info" "palco faixa";gap:8px;padding-top:8px}
 .info{padding:8px 10px;flex-direction:row;align-items:center;gap:10px}
 .info-tit{flex:1;min-width:0}
 .info h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .info .sobre{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .info-rolo{display:none}
 .bt-det{padding:6px 10px;min-height:32px;font-size:13px}
 .fases .fase-b:not([aria-current="true"]){display:none}
 .seg{display:none}.ver-sel{display:block}
}
</style>
</head>

const API = {
  sso:   {n:'Entrada com gov.br (SSO do Sistema Confea/Crea)', s:'preparo', st:'em preparo', d:'Serviço de entrada único do Sistema Confea/Crea, que autentica no gov.br e devolve CPF, nome e nível da conta (bronze, prata ou ouro). Liberado para o Crea-SP; falta só cadastrar o endereço de retorno da plataforma.'},
  ass:   {n:'Assinatura eletrônica gov.br', s:'preparo', st:'em preparo', d:'Assinatura eletrônica avançada do gov.br, em preparo como módulo do serviço de entrada do Sistema Confea/Crea, para assinar sem sair da plataforma. Exige conta prata ou ouro.'},
  a1:    {n:'A1 · Profissional', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Recebe o CPF ou o registro no corpo da requisição e devolve situação do registro ou visto, títulos e câmara, sexo, data de formatura, endereços residencial e comercial completos, data da última alteração de endereço, identidade, filiação, e-mail, celular e os demais campos do cadastro.'},
  nome:  {n:'Busca por nome completo', s:'aguarda', st:'aguardando para testes', d:'Consulta do Crea-SP que recebe o nome completo e devolve as pessoas encontradas, com registro, título e município, para quem indica escolher a certa. Depois da escolha, a conferência segue pela A1, pelo CPF.'},
  a2:    {n:'A2 · Anuidades', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Recebe o CPF e os exercícios e devolve a situação de cada anuidade, se foi à vista ou parcelada e as parcelas vencidas em aberto.'},
  a3:    {n:'A3 · Empresas do profissional', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Recebe o CPF e devolve as empresas em que o profissional é sócio, diretor ou responsável técnico, com CNPJ, situação do registro e da anuidade.'},
  a4:    {n:'A4 · Processos', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Recebe o CPF e informa só se existe processo ético ou por infração, com tipo, situação e datas, sem o conteúdo.'},
  a5:    {n:'A5 · Extratos', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Devolve o PDF do resumo profissional e do resumo de empresa, que entram no dossiê.'},
  a6:    {n:'A6 · Foto do cadastro', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Devolve a foto do cadastro do profissional, se houver, usada na carteira com autorização registrada.'},
  a7:    {n:'A7 · Monitoramento em lote', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Uma chamada por mês, de madrugada, com os CPFs dos inspetores em exercício. Devolve registro, anuidade, empresas, processos novos e cargos.'},
  a8:    {n:'A8 · Alterações desde uma data', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP. Traz só o que mudou na estrutura (GREs, unidades, Inspetorias, câmaras, cadeiras), nos mandatos, nos funcionários e nos conselheiros. Mantém a cópia da plataforma atualizada. Para os acessos, a plataforma confere o cargo e a lotação de cada funcionário uma vez por mês.'},
  a9:    {n:'A9 · Cadastro do inspetor no Numéria', s:'aguarda', st:'aguardando para testes', d:'API do Crea-SP que grava no Numéria, onde é feito o ressarcimento. Consulta pelo CPF se o inspetor já tem cadastro e dados bancários, inclui ou atualiza o inspetor com o mandato, inclui ou atualiza os dados bancários e registra a exoneração ou o fim do mandato.'},
  a10:   {n:'A10 · Entidades de classe e diretorias', s:'pronto', st:'parte pronta', d:'API do Crea-SP. A lista de entidades e presidentes está pronta, com a documentação a caminho para os testes. A diretoria de cada entidade, com cargo e mandato, está em preparo.'},
  div:   {n:'Divisão territorial e gestores', s:'aguarda', st:'aguardando liberação', d:'Leitura automática, somente de consulta, da planilha oficial que liga município, unidade, GRE, Chefe de Equipe e Gerente Regional. Aguardando a liberação do acesso pelo Crea-SP.'},
  emis:  {n:'Sites dos emissores das certidões', s:'preparo', st:'em teste', d:'Polícia Civil de SP, TJSP, TRF3 e Polícia Federal. A plataforma lê o PDF original e confere o código de autenticidade na página oficial de cada emissor.'},
  base:  {n:'Base da plataforma', s:'interno', st:'na plataforma', d:'Cadastro de acessos, vagas e cadeiras, mandatos, indicações, documentos, assinaturas e o registro de cada conferência com data, hora e fonte.'},
  mail:  {n:'E-mail institucional e alertas no aplicativo', s:'aguarda', st:'aguardando liberação', d:'Avisos de cada etapa por e-mail, com remetente institucional a ser liberado pelo Crea-SP, e por alerta no aplicativo.'},

const idx = id => P.findIndex(x => x.id === id);
let atual = 0, ver = 'auto';
const $ = id => document.getElementById(id);
const faseDe = it => it.p ? P[idx(it.p)].fase : it.fase;

/* Desenha o fluxograma. compacto: caixas só com número e título.
   empilhar: uma faixa por fase. fase: só uma fase. */
function construir({compacto = false, empilhar = false, fase} = {}){
  const K = compacto
    ? {NW:158, NH:80, GAP:42, DW:150, DH:72, FW:150, FH:56, Y1:52, Y2:180, FOLGA:18, X0:190}
    : {NW:200, NH:146, GAP:56, DW:168, DH:112, FW:184, FH:74, Y1:54, Y2:266, FOLGA:26, X0:196};
  const ROWH = K.Y2 + K.NH + K.FOLGA;
  let itens = LINHA.map((it, k) => ({...it, k, fase: faseDe(it)}));
  if (fase !== undefined) itens = itens.filter(it => it.fase === fase);
  let row = 0, col = 0, ult = null;
  itens.forEach(it => { if (empilhar && ult !== null && it.fase !== ult){ row++; col = 0; } ult = it.fase; it.row = row; it.col = col++; });
  const X = c => K.X0 + c * (K.NW + K.GAP), Yb = r => r * ROWH;
  const pos = {}, setas = [], rots = [];
  let h = '', largMax = 0;
  const no = (i, x, y) => { const p = P[i];
    return `<button type="button" class="fx-n" data-i="${i}" data-no="${p.id}" style="left:${x}px;top:${y}px;width:${K.NW}px;height:${K.NH}px">
      <span class="num">${String(i+1).padStart(2,'0')}</span><b>${e(p.t)}</b>${compacto ? '' : `<span class="qm">${e(p.ator.join(', '))}</span>
      <span class="cps">${p.apis.map(k => `<span class="fx-c st-${API[k].s}" title="${e(API[k].n)}">${e(CURTO[k])}</span>`).join('')}</span>`}</button>`; };
  /* faixas das fases e entradas de cada linha */
  const grupos = {};
  itens.forEach(it => { const g = grupos[it.row + ':' + it.fase] = grupos[it.row + ':' + it.fase] || {row:it.row, fase:it.fase, a:it.col, b:it.col}; g.b = it.col; });
  Object.values(grupos).forEach(g => { h += `<div class="fx-fase" style="left:${X(g.a)}px;width:${X(g.b) + K.NW - X(g.a)}px;top:${Yb(g.row) + 6}px">${g.fase + 1}. ${e(FASES[g.fase])}</div>`; });
  const inicios = {};
  itens.forEach(it => { if (!(it.row in inicios)) inicios[it.row] = it; });
  Object.values(inicios).forEach(it => {
    const y = Yb(it.row) + K.Y1 + K.NH / 2;
    if (it.k === 0){ pos.inicio = {x:8, y:y - K.NH / 2, w:K.X0 - 34, h:K.NH, it:{row:it.row, col:-1}}; }
    if (it.k === 0) h += `<button type="button" class="fx-fim fx-ini" data-x="inicio" data-no="inicio" title="Toque para ver o que acontece antes do primeiro passo" style="left:8px;top:${y - K.NH / 2}px;width:${K.X0 - 34}px;height:${K.NH}px"><span><b>Início</b><br><small>Em segundo plano, a equipe técnica cadastra os administradores</small></span></button>`;
    else { const ant = [...LINHA.slice(0, it.k)].reverse().find(x => x.p); h += `<button type="button" class="fx-fim" data-i="${idx(ant.p)}" style="left:8px;top:${y - 26}px;width:${K.X0 - 36}px;height:52px">vem da fase ${faseDe(LINHA[it.k - 1]) + 1}</button>`; }
    setas.push(`M${K.X0 - 28} ${y} L${X(0) + (it.d ? (K.NW - K.DW) / 2 : 0)} ${y}`);
  });
  /* linha principal */
  itens.forEach((it, j) => {
    const x = X(it.col), y0 = Yb(it.row);
    if (it.p){ pos[it.p] = {x, y:y0 + K.Y1, w:K.NW, h:K.NH, it}; h += no(idx(it.p), x, y0 + K.Y1); }
    else { const dx = x + (K.NW - K.DW) / 2, dy = y0 + K.Y1 + (K.NH - K.DH) / 2; pos[it.d] = {x:dx, y:dy, w:K.DW, h:K.DH, it};
      h += `<button type="button" class="fx-dec" data-x="${it.d}" data-no="${it.d}" style="left:${dx}px;top:${dy}px;width:${K.DW}px;height:${K.DH}px"><span class="losango" aria-hidden="true"></span><span>${e(it.t)}</span></button>`; }
    largMax = Math.max(largMax, x + K.NW);
    const prox = itens[j + 1], y = y0 + K.Y1 + K.NH / 2;
    if (prox && prox.row === it.row){
      const ini = it.d ? x + (K.NW + K.DW) / 2 : x + K.NW, fim = X(prox.col) + (prox.d ? (K.NW - K.DW) / 2 : 0);
      setas.push(`M${ini} ${y} L${fim} ${y}`);
      if (it.d) rots.push([(ini + fim) / 2, y - 11, it.sim]);
    } else if (it.k < LINHA.length - 1){
      const ini = it.d ? x + (K.NW + K.DW) / 2 : x + K.NW;
      setas.push(`M${ini} ${y} L${ini + 34} ${y}`);
      const seg = LINHA[it.k + 1];
      h += `<button type="button" class="fx-fim" data-i="${idx(seg.p || seg.ir)}" style="left:${ini + 36}px;top:${y - 26}px;width:112px;height:52px">segue na fase ${faseDe(seg) + 1}</button>`;
      largMax = Math.max(largMax, ini + 150);
    }
  });
  /* desvios */
  DESVIO.forEach(dv => {
    const base = pos[dv.sob]; if (!base) return;
    const col = base.it.col + (dv.desl || 0), y0 = Yb(base.it.row), cx = X(col) + K.NW / 2;
    const ox = base.x + base.w / 2, oy = base.y + base.h;
    let nx, ny, nw, nh;
    if (dv.p){ nw = K.NW; nh = K.NH; nx = X(col); ny = y0 + K.Y2; pos[dv.p] = {x:nx, y:ny, w:nw, h:nh, it:{row:base.it.row, col}}; h += no(idx(dv.p), nx, ny); }
    else { nw = K.FW; nh = K.FH; nx = cx - K.FW / 2; ny = y0 + K.Y2 + (K.NH - K.FH) / 2;
      if (dv.id) pos[dv.id] = {x:nx, y:ny, w:nw, h:nh, it:{row:base.it.row, col}};
      h += `<button type="button" class="fx-fim" ${dv.id ? `data-x="${dv.id}" data-no="${dv.id}"` : `data-i="${idx(dv.ir)}"`} style="left:${nx}px;top:${ny}px;width:${nw}px;height:${nh}px">${e(dv.fim)}</button>`; }
    largMax = Math.max(largMax, nx + nw);
    const ax = nx + nw / 2, my = (oy + ny) / 2;
    setas.push(dv.desl ? `M${ox} ${oy} L${ox} ${my} L${ax} ${my} L${ax} ${ny}` : `M${ox} ${oy} L${ax} ${ny}`);
    rots.push([dv.desl ? (ox + ax) / 2 : ox, my, dv.rot]);
    if (dv.volta && pos[dv.volta]){ const v = pos[dv.volta], vx = v.x + v.w / 2, yb = ny + nh / 2;
      setas.push(`M${nx} ${yb} L${vx} ${yb} L${vx} ${v.y + v.h}`); rots.push([(nx + vx) / 2, yb, 'volta: ' + dv.vrot]); }
    if (dv.junta){ const pr = itens.find(x => x.k === base.it.k + 1), v = pr && (pos[pr.p] || pos[pr.d]);
      if (v){ const vx = v.x + v.w / 2, yb = ny + nh / 2; setas.push(`M${nx + nw} ${yb} L${vx} ${yb} L${vx} ${v.y + v.h}`); rots.push([(nx + nw + vx) / 2, yb, 'aprovada']); } }
  });
  const w = largMax + 24, alt = (row + 1) * ROWH;
  const svg = `<svg width="${w}" height="${alt}" aria-hidden="true"><defs><marker id="pt${compacto?'c':'n'}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--tx3)"/></marker></defs>${setas.map(d => `<path d="${d}" fill="none" stroke="var(--tx3)" stroke-width="1.6" marker-end="url(#pt${compacto?'c':'n'})"/>`).join('')}</svg>`;
  const html = `<div class="fx-tela${compacto ? ' compacto' : ''}" style="width:${w}px;height:${alt}px">${svg}${h}${rots.map(([x, y, t]) => `<span class="fx-rot" style="left:${x}px;top:${y}px">${e(t)}</span>`).join('')}<span class="fx-aqui" hidden>Você está aqui</span></div>`;
  return {html, w, h:alt, pos};
}

/* Ordem de percurso, para marcar o que já foi feito */
const ORDEM = {};
LINHA.forEach((it, c) => { if (it.p) ORDEM[it.p] = c; });
DESVIO.forEach(dv => { if (dv.p) ORDEM[dv.p] = LINHA.findIndex(x => (x.p || x.d) === dv.sob) + 0.5; });

function marcar(raiz, d, id){
  const lim = ORDEM[id];
  raiz.querySelectorAll('.fx-n').forEach(b => {
    const o = ORDEM[b.dataset.no];
    b.classList.toggle('ativo', b.dataset.no === id);
    b.classList.toggle('feito', b.dataset.no !== id && Number.isInteger(o) && o < lim);
  });
  raiz.querySelectorAll('.fx-dec,.fx-fim[data-x]').forEach(b => b.classList.toggle('ativo', b.dataset.no === id));
  const aqui = raiz.querySelector('.fx-aqui'), q = d.pos[id];
  if (!q){ aqui.hidden = true; return null; }
  aqui.hidden = false; aqui.style.left = (q.x + q.w / 2) + 'px'; aqui.style.top = (q.y - 3) + 'px';
  return q;
}

/* Faixa: fluxograma em movimento, sem rolagem */
let FAIXA;
function montarFaixa(){ FAIXA = construir({compacto:true}); $('fx-vista').innerHTML = FAIXA.html; }
function moverFaixa(anima = true){
  const v = $('fx-vista'), t = v.firstElementChild, p = P[atual];
  const q = marcar(t, FAIXA, EXPL ? EXPL.id : p.id);
  const W = v.clientWidth, H = v.clientHeight;
  const s = Math.min(1, (H - 6) / FAIXA.h);
  let tx = q ? W / 2 - (q.x + q.w / 2) * s : 0;
  tx = Math.min(0, Math.max(W - FAIXA.w * s, tx));
  if (FAIXA.w * s < W) tx = (W - FAIXA.w * s) / 2;
  const ty = Math.max(0, (H - FAIXA.h * s) / 2);
  t.style.transition = anima ? '' : 'none';
  t.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}

/* Explicação de decisão, encerramento ou início */
let EXPL = null;
function caminhosDe(x){
  const c = [];
  if (x.id === 'inicio'){ c.push(['Começa', P[idx('organograma')].t, 'organograma']); return c; }
  const k = LINHA.findIndex(it => it.d === x.id);
  if (k >= 0){
    const prox = LINHA[k + 1]; if (prox){ const alvo = prox.p || prox.ir; c.push([LINHA[k].sim, prox.p ? P[idx(prox.p)].t : prox.t, alvo]); }
    DESVIO.filter(dv => dv.sob === x.id).forEach(dv => c.push([dv.rot, dv.p ? P[idx(dv.p)].t : dv.fim, dv.p || dv.id]));
  } else {
    const dv = DESVIO.find(d => d.id === x.id); if (dv) c.push(['Depois', P[idx(dv.ir)].t, dv.ir]);
  }
  return c;
}
function cardExplica(x, m){
  const cam = caminhosDe(x);
  return `<div class="explica${m ? ' m' : ''}">
    <div class="explica-cab"><span class="explica-forma ${x.tipo.startsWith('Decisão') ? 'losango' : 'pilula'}" aria-hidden="true"></span><div><p class="sobre">${e(x.tipo)}</p><h3>${e(x.t)}</h3></div></div>
    ${x.txt.map(t => `<p>${e(t)}</p>`).join('')}
    ${x.crit.length ? `<h4>Como é decidido</h4><ul>${x.crit.map(r => `<li>${e(r)}</li>`).join('')}</ul>` : ''}
    <h4>Caminhos</h4><div class="ramos">${cam.map(r => `<button type="button" class="ramo" ${EXPLICA[r[2]] ? `data-x="${r[2]}"` : `data-ir="${r[2]}"`}><span><b>${e(r[0])}:</b> ${e(r[1])}</span><i>›</i></button>`).join('')}</div>
    <h4>Integrações</h4><div class="int-lista">${x.apis.map(k => `<div class="int"><span>${e(API[k].n)}</span><span class="st st-${API[k].s}">${e(API[k].st)}</span></div>`).join('')}</div>
  </div>`;
}
function explicar(id){
  if (!EXPLICA[id]) return;
  const x = {...EXPLICA[id], id};
  EXPL = x;
  /* passo de referência: o anterior à decisão, ou a origem do desvio */
  let ref = x.ir;
  const dec = LINHA.find(it => it.d === id);
  if (dec) ref = dec.ir;
  const dv = DESVIO.find(d => d.id === id);
  if (dv){ const origem = LINHA.find(it => it.d === dv.sob); ref = origem ? origem.ir : dv.sob; }
  if (ref) atual = idx(ref);
  const p = P[atual];
  $('contador').textContent = `${atual + 1} de ${P.length}`;
  $('ant').disabled = false; $('prox').disabled = atual === P.length - 1;
  $('ir-para').value = String(atual);
  document.querySelectorAll('#fases .fase-b').forEach(b => b.setAttribute('aria-current', +b.dataset.fase === p.fase));
  montarInfo();
  montarPalco();
  moverFaixa();
  if (JANELA){ desenharJanela(); }
  history.replaceState(null, '', '#x-' + id);
}

/* Telas */
const NAT = {web:{w:960}, android:{w:300}, ios:{w:300}};
function moldura(tipo, p, modal){
  const pf = PERFIL[p.perfil];
  const corpo = p.tela(tipo !== 'web');
  const cab = modal ? '' : `<div class="dispo-cab"><span class="dispo-nome">${tipo === 'web' ? 'Web' : tipo === 'ios' ? 'iOS' : 'Android'}</span><button type="button" class="ampliar" data-ampliar="${tipo}">Ampliar</button></div>`;
  if (tipo === 'web'){
    const nav = pf.nav.map((t,i)=>`<span class="${i===p.nav?'ativo':''}">${t}</span>`).join('');
    const topo = p.perfil === 'publico' ? '' :
      `<div class="web-topo"><img src="${LOGO}" data-logo alt="Crea-SP"><nav aria-label="Menu da plataforma">${nav}</nav><div class="web-usuario"><b>${e(pf.nome)}</b>${e(pf.papel)}</div></div>`;
    return `<div class="dispo d-web">${cab}<div class="nav-web"><div class="nav-barra"><i></i><i></i><i></i><div class="nav-end"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Z"/></svg>inspetores.creasp.org.br/${URL_P[p.id] || ''}</div></div>
      <div class="web-app">${topo}<div class="web-corpo">${corpo}</div></div></div></div>`;
  }
  const ios = tipo === 'ios';
  const abas = pf.abas.length ? `<div class="abas">${pf.abas.map((t,i)=>`<span class="${i===p.nav?'ativo':''}"><i></i>${t}</span>`).join('')}</div>` : '';
  const barra = p.perfil === 'publico' ? '' : `<div class="app-barra">${ios?'<span class="voltar">‹ Voltar</span>':'<span class="voltar" aria-hidden="true">←</span>'}<b>${e(pf.abas[p.nav] || p.t)}</b></div>`;
  const status = `<div class="tel-status"><span>10:12</span><span class="icones" aria-hidden="true"><i style="width:14px;height:8px"></i><i style="width:12px;height:8px;opacity:.7"></i><i style="width:20px;height:9px;border-radius:3px"></i></span></div>`;
  return `<div class="dispo d-${tipo}">${cab}<div class="tel"><div class="tel-tela">
    ${ios?'<span class="ilha" aria-hidden="true"></span>':'<span class="camera" aria-hidden="true"></span>'}
    ${status}${barra}<div class="app-corpo">${corpo}</div>${abas}<div class="gesto" aria-hidden="true"><i></i></div></div></div></div>`;
}

/* Encaixa um conteúdo de tamanho natural dentro de uma caixa, sem rolagem */
function encaixar(caixa, el, {topo = 0, max = 1.3, margem = 12} = {}){
  el.style.transform = 'none';
  const cw = el.offsetWidth, ch = el.offsetHeight;
  const W = caixa.clientWidth - margem * 2, H = caixa.clientHeight - topo - margem * 2;
  const s = Math.max(0.05, Math.min(max, W / cw, H / ch));
  el.style.transform = `translate(${(caixa.clientWidth - cw * s) / 2}px,${topo + margem + (H - ch * s) / 2}px) scale(${s})`;
  return s;
}

function escalaDe(lista){
  const palco = $('palco');
  const largura = lista.reduce((a, t) => a + NAT[t].w, 0) + 28 * (lista.length - 1);
  const altura = (lista.includes('web') && lista.length === 1 ? 600 + 38 : 636) + 34;
  return Math.min((palco.clientWidth - 24) / largura, (palco.clientHeight - 56) / altura);
}
function telasVisiveis(){
  if (ver !== 'auto') return ver === 'todos' ? ['web','android','ios'] : [ver];
  if (escalaDe(['web','android','ios']) >= 0.5) return ['web','android','ios'];
  if (escalaDe(['android','ios']) >= 0.62 && $('palco').clientWidth > 640) return ['android','ios'];
  const palco = $('palco');
  return palco.clientWidth / palco.clientHeight >= 1.25 ? ['web'] : ['android'];
}
function montarPalco(){
  const p = P[atual], lista = telasVisiveis();
  if (EXPL){ $('cena').innerHTML = cardExplica(EXPL, false); ajustarPalco(); return; }
  $('cena').innerHTML = lista.map(t => moldura(t, p)).join('');
  trocarLogos();
  ajustarPalco();
}
function ajustarPalco(){ encaixar($('palco'), $('cena'), {topo:36, max:1.25, margem:8}); }

function escuro(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function trocarLogos(){ const src = escuro() ? LOGO_NEG : LOGO; document.querySelectorAll('img[data-logo]').forEach(i => i.src = src); }

/* Janela de detalhe */
let JANELA = null;  /* {tipo:'det'} | {tipo:'tela', qual} | {tipo:'fluxo', fase} */
function abrir(j){ JANELA = j; const m = $('modal'); if (!m.open) m.showModal(); desenharJanela(); }
function desenharJanela(){
  if (!JANELA) return;
  const p = P[atual], corpo = $('modal-corpo'), abas = $('modal-abas');
  $('modal-leg').hidden = JANELA.tipo !== 'fluxo';
  corpo.className = 'modal-corpo';
  if (JANELA.tipo === 'det' && EXPL){
    $('modal-tit').textContent = `${EXPL.tipo}: ${EXPL.t}`;
    abas.innerHTML = '';
    corpo.classList.add('texto');
    corpo.innerHTML = `<div class="det"><div>${cardExplica(EXPL, true)}</div><div><h3>Integrações acionadas</h3><div class="apis">${EXPL.apis.map(k => { const a = API[k]; return `<div class="api"><div class="api-l1"><span class="api-nome">${e(a.n)}</span><span class="st st-${a.s}">${e(a.st)}</span></div><p>${e(a.d)}</p></div>`; }).join('')}</div></div></div>`;
  } else if (JANELA.tipo === 'det'){
    $('modal-tit').textContent = `${String(atual+1).padStart(2,'0')}. ${p.t}`;
    abas.innerHTML = '';
    corpo.classList.add('texto');
    corpo.innerHTML = `<div class="det"><div>
      <div class="quem" style="margin-bottom:10px">${p.ator.map(a=>`<span class="etq etq-ator">${e(a)}</span>`).join('')}<span class="etq etq-canal">${e(p.canal)}</span></div>
      <h3>O que acontece</h3>${p.txt.map(t=>`<p>${e(t)}</p>`).join('')}
      ${p.regras ? `<h3>Regras</h3><ul>${p.regras.map(r=>`<li>${e(r)}</li>`).join('')}</ul>` : ''}
      ${p.ramos ? `<h3>Caminhos</h3><div class="ramos">${p.ramos.map(r=>`<button type="button" class="ramo" data-ir="${r[2]}"><span><b>${e(r[0])}:</b> ${e(r[1])}</span><i>Ver</i></button>`).join('')}</div>` : ''}
      </div><div><h3>Integrações acionadas</h3><div class="apis">${p.apis.map(k => { const a = API[k]; return `<div class="api"><div class="api-l1"><span class="api-nome">${e(a.n)}</span><span class="st st-${a.s}">${e(a.st)}</span></div><p>${e(a.d)}</p></div>`; }).join('')}</div></div></div>`;
  } else if (JANELA.tipo === 'tela'){
    $('modal-tit').textContent = `${JANELA.qual === 'web' ? 'Web' : JANELA.qual === 'ios' ? 'iOS' : 'Android'} · ${p.t}`;
    abas.innerHTML = ['web','android','ios'].map(t => `<button type="button" class="fase-b" data-jt="${t}" aria-current="${t === JANELA.qual}">${t === 'web' ? 'Web' : t === 'ios' ? 'iOS' : 'Android'}</button>`).join('');
    corpo.innerHTML = `<div class="encaixe">${moldura(JANELA.qual, p, true)}</div>`;
    trocarLogos();
    encaixar(corpo, corpo.firstElementChild, {max:1.6, margem:14});
  } else {
    $('modal-tit').textContent = 'Fluxograma da jornada';
    const f = JANELA.fase;
    abas.innerHTML = `<button type="button" class="fase-b" data-jf="todas" aria-current="${f === 'todas'}">Todas as fases</button>` +
      FASES.map((n, i) => `<button type="button" class="fase-b" data-jf="${i}" aria-current="${f === i}">${i + 1}<span class="nm">. ${e(n)}</span></button>`).join('');
    const d = f === 'todas' ? construir({compacto:true, empilhar:true}) : construir({fase:f});
    corpo.innerHTML = `<div class="encaixe">${d.html}</div>`;
    const el = corpo.firstElementChild;
    el.firstElementChild.style.position = 'relative';
    marcar(el, d, EXPL ? EXPL.id : p.id);
    encaixar(corpo, el, {max:1.2, margem:16});
  }
}
$('fechar').onclick = () => $('modal').close();
$('modal').addEventListener('close', () => { JANELA = null; });
$('modal').addEventListener('click', ev => { if (ev.target === $('modal')) $('modal').close(); });

/* Painel do passo */
function montarInfo(){
  const p = P[atual];
  if (EXPL){
    const x = EXPL, cam = caminhosDe(x);
    $('p-fase').textContent = `Fase ${p.fase + 1} · ${FASES[p.fase]} · ${x.tipo.toLowerCase()}`;
    $('p-titulo').textContent = x.t;
    $('p-quem').innerHTML = `<span class="etq etq-canal">${e(x.tipo)}</span><span class="etq etq-canal">Depois do passo ${String(atual + 1).padStart(2,'0')}</span>`;
    $('p-resumo').textContent = x.txt[0];
    $('p-ramos').innerHTML = `<h2>Caminhos</h2><div class="ramos">${cam.map(r => `<button type="button" class="ramo" ${EXPLICA[r[2]] ? `data-x="${r[2]}"` : `data-ir="${r[2]}"`}><span><b>${e(r[0])}:</b> ${e(r[1])}</span><i>›</i></button>`).join('')}</div>`;
    $('p-ints').innerHTML = x.apis.map(k => `<div class="int"><span>${e(API[k].n)}</span><span class="st st-${API[k].s}">${e(API[k].st)}</span></div>`).join('');
    ajustarInfo();
    return;
  }
  $('p-fase').textContent = `Fase ${p.fase + 1} · ${FASES[p.fase]}`;
  $('p-titulo').textContent = p.t;
  $('p-quem').innerHTML = p.ator.map(a=>`<span class="etq etq-ator">${e(a)}</span>`).join('') + `<span class="etq etq-canal">${e(p.canal)}</span>`;
  $('p-resumo').textContent = p.txt[0];
  $('p-ramos').innerHTML = p.ramos ? `<h2>Caminhos</h2><div class="ramos">${p.ramos.map(r=>`<button type="button" class="ramo" data-ir="${r[2]}"><span><b>${e(r[0])}:</b> ${e(r[1])}</span><i>›</i></button>`).join('')}</div>` : '';
  $('p-ints').innerHTML = p.apis.map(k => `<div class="int"><span>${e(API[k].n)}</span><span class="st st-${API[k].s}">${e(API[k].st)}</span></div>`).join('');
  ajustarInfo();
}
/* Reduz o texto do painel até caber, para tudo ficar visível */
function ajustarInfo(){
  const r = $('info-rolo'); let f = 14;
  r.style.fontSize = f + 'px';
  while (r.clientHeight > 0 && r.scrollHeight > r.clientHeight + 1 && f > 10){ f -= 0.5; r.style.fontSize = f + 'px'; }
  r.classList.toggle('corta', r.clientHeight > 0 && r.scrollHeight > r.clientHeight + 2);
}
function montarFases(){
  $('fases').innerHTML = FASES.map((n, i) => `<button type="button" class="fase-b" data-fase="${i}" title="${e(n)}">${i + 1}<span class="nm">. ${e(n)}</span></button>`).join('');
}
function montarSeletor(){
  let h = '', f = -1;
  P.forEach((p, i) => {
    if (p.fase !== f){ if (f >= 0) h += '</optgroup>'; f = p.fase; h += `<optgroup label="${e(FASES[f])}">`; }
    h += `<option value="${i}">${String(i+1).padStart(2,'0')}. ${e(p.t)}</option>`;
  });
  $('ir-para').innerHTML = h + '</optgroup>';
}

function mostrar(i){
  EXPL = null;
  atual = Math.max(0, Math.min(P.length - 1, i));
  const p = P[atual];
  $('contador').textContent = `${atual + 1} de ${P.length}`;
  $('ant').disabled = atual === 0; $('prox').disabled = atual === P.length - 1;
  $('ir-para').value = String(atual);
  document.querySelectorAll('#fases .fase-b').forEach(b => b.setAttribute('aria-current', +b.dataset.fase === p.fase));
  montarInfo(); montarPalco(); moverFaixa();
  if (JANELA){ if (JANELA.tipo === 'fluxo' && JANELA.fase !== 'todas') JANELA.fase = p.fase; desenharJanela(); }
  if (location.hash.slice(1) !== p.id) history.replaceState(null, '', '#' + p.id);
}

document.addEventListener('click', ev => {
  const amp = ev.target.closest('[data-ampliar]'); if (amp){ abrir({tipo:'tela', qual:amp.dataset.ampliar}); return; }
  const jt = ev.target.closest('[data-jt]'); if (jt){ JANELA.qual = jt.dataset.jt; desenharJanela(); return; }
  const jf = ev.target.closest('[data-jf]'); if (jf){ JANELA.fase = jf.dataset.jf === 'todas' ? 'todas' : +jf.dataset.jf; desenharJanela(); return; }
  const fb = ev.target.closest('[data-fase]'); if (fb){ mostrar(P.findIndex(x => x.fase === +fb.dataset.fase)); return; }
  const ex = ev.target.closest('[data-x]'); if (ex){ explicar(ex.dataset.x); return; }
  const alvo = ev.target.closest('[data-ir],[data-i]');
  if (!alvo) return;
  if (alvo.dataset.ir !== undefined){ if (alvo.dataset.ir) mostrar(idx(alvo.dataset.ir)); return; }
  mostrar(+alvo.dataset.i);
});
$('ant').onclick = () => mostrar(EXPL ? atual : atual - 1);
$('prox').onclick = () => mostrar(atual + 1);
$('ir-para').onchange = ev => mostrar(+ev.target.value);
$('bt-det').onclick = () => abrir({tipo:'det'});
$('bt-completo').onclick = () => abrir({tipo:'fluxo', fase:P[atual].fase});
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,textarea,select')) return;
  if (ev.key === 'ArrowRight') mostrar(atual + 1);
  if (ev.key === 'ArrowLeft') mostrar(atual - 1);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h.startsWith('x-')){ if (!EXPL || EXPL.id !== h.slice(2)) explicar(h.slice(2)); return; } const i = idx(h); if (i >= 0 && (i !== atual || EXPL)) mostrar(i); });
let tReaj;
new ResizeObserver(() => { cancelAnimationFrame(tReaj); tReaj = requestAnimationFrame(() => { montarPalco(); moverFaixa(false); montarInfo(); desenharJanela(); }); }).observe(document.body);

function escolherVer(v){
  ver = v;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.ver === v));
  $('ver-sel').value = v;
  try { localStorage.setItem('ver2', v); } catch(_) {}
  montarPalco();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => escolherVer(b.dataset.ver));
$('ver-sel').onchange = ev => escolherVer(ev.target.value);
$('tema').onclick = () => { document.documentElement.dataset.theme = escuro() ? 'light' : 'dark'; trocarLogos(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', trocarLogos);

montarSeletor(); montarFases(); montarFaixa();
try { const v = localStorage.getItem('ver2'); if (v && ['auto','todos','web','android','ios'].includes(v)) escolherVer(v); } catch(_) {}
const h0 = location.hash.slice(1);
if (h0.startsWith('x-') && EXPLICA[h0.slice(2)]){ mostrar(0); explicar(h0.slice(2)); } else { const ini = idx(h0); mostrar(ini >= 0 ? ini : 0); }
</script>
